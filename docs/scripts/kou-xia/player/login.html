<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色登入與註冊 — 寇俠</title>
  <style>
    /* ground:#1a1510 text:#e4d9c4 gold:#c49a38 */
    :root {
      --g: #1a1510; --s: #231d16; --s2: #2d2519;
      --t: #f4ebd9; --d: #ad997e; --b: #4e3f2f;
      --au: #e4b854; --err: #e65555;
      --f: "Noto Serif SC","Source Han Serif SC","思源宋體","Noto Serif","SimSun","MingLiU",Georgia,serif;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      background: var(--g); color: var(--t);
      font-family: var(--f); font-size: 15px; line-height: 1.8;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    a { color: var(--au); text-decoration: none; } a:hover { opacity:.8; text-decoration: underline; }

    /* ── back link ── */
    .back-link {
      position: fixed; top: 1rem; left: 1rem;
      font-size: .78rem; color: var(--d);
    }
    .back-link:hover { color: var(--au); }

    /* ── card ── */
    .card {
      width: 100%; max-width: 380px;
      background: var(--s);
      border: 1px solid var(--b);
      border-radius: 6px;
      padding: 2.2rem 2rem 2rem;
      margin: 1rem;
    }

    .card-eye {
      font-size: .68rem; letter-spacing: .3em;
      color: var(--d); text-transform: uppercase;
      text-align: center; margin-bottom: .6rem;
    }
    .card-title {
      font-size: 1.55rem; font-weight: 700;
      color: var(--au); letter-spacing: .08em;
      text-align: center; margin-bottom: .3rem;
    }
    .card-sub {
      font-size: .8rem; color: var(--d); text-align: center;
      margin-bottom: 1.8rem;
    }
    .gold-rule { width: 40px; height: 1px; background: var(--au); opacity:.3; margin: .5rem auto 1.6rem; }

    /* ── form ── */
    .field { margin-bottom: 1.1rem; }
    .field label {
      display: block; font-size: .73rem;
      letter-spacing: .12em; color: var(--d);
      margin-bottom: .38rem; font-weight: 600;
    }
    .field input, .field select {
      width: 100%; background: var(--g);
      border: 1px solid var(--b); border-radius: 3px;
      padding: .6rem .75rem; font-size: .95rem;
      color: var(--t); font-family: var(--f);
      outline: none; transition: border-color .15s;
    }
    .field input::placeholder { color: var(--d); opacity: .6; }
    .field input:focus, .field select:focus { border-color: rgba(196,154,56,.5); }

    /* ── submit button ── */
    .submit-btn {
      width: 100%; margin-top: 1.4rem;
      background: var(--au); color: #1a1208;
      border: none; border-radius: 3px;
      padding: .72rem 1rem; font-size: .95rem;
      font-family: var(--f); font-weight: 700;
      letter-spacing: .08em; cursor: pointer;
      transition: opacity .15s;
    }
    .submit-btn:hover { opacity: .88; }
    .submit-btn:active { opacity: .75; }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── error / status ── */
    .err-msg {
      display: none; margin-top: .85rem;
      font-size: .82rem; color: var(--err);
      text-align: center; line-height: 1.55;
    }
    .err-msg.show { display: block; }

    .success-msg {
      display: none; margin-top: .85rem;
      font-size: .82rem; color: #68b880;
      text-align: center; line-height: 1.55;
    }
    .success-msg.show { display: block; }

    /* ── mismatch banner ── */
    .mismatch-banner {
      display: none; width:100%; max-width:380px;
      background: rgba(192,64,64,.12); border:1px solid rgba(192,64,64,.3);
      border-radius: 4px; padding: .65rem .9rem;
      font-size: .82rem; color: #d07070;
      margin-bottom: .8rem; margin-left: 1rem; margin-right: 1rem;
      line-height: 1.55;
    }

    /* ── register hint ── */
    .register-hint {
      margin-top: 1.5rem; padding-top: 1.2rem;
      border-top: 1px solid var(--b);
      font-size: .78rem; color: var(--d);
      text-align: center; line-height: 1.7;
    }
    .register-hint strong { color: var(--t); }

    /* ── logged-in state ── */
    .already-in {
      display: none; text-align: center;
    }
    .already-in .char-name {
      font-size: 1.3rem; font-weight: 700;
      color: var(--au); margin: .5rem 0 .2rem;
    }
    .already-in .player-name { font-size: .85rem; color: var(--d); }
    .already-in .goto-btn {
      display: inline-block; margin-top: 1.2rem;
      background: var(--au); color: #1a1208;
      border-radius: 3px; padding: .6rem 1.4rem;
      font-size: .9rem; font-weight: 700;
      text-decoration: none; letter-spacing: .06em;
    }
    .already-in .goto-btn:hover { opacity: .88; text-decoration: none; }
    .already-in .logout-link {
      display: block; margin-top: .9rem;
      font-size: .78rem; color: var(--d); cursor: pointer;
    }
    .already-in .logout-link:hover { color: var(--au); text-decoration: underline; }

    /* footer */
    .login-footer {
      position: fixed; bottom: 1rem; left: 0; right: 0;
      text-align: center; font-size: .75rem; color: var(--d);
    }
    .login-footer a { color: var(--d); } .login-footer a:hover { color: var(--au); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<a class="back-link" href="../index.html">← 返回上一層 (寇俠首頁)</a>

<!-- mismatch banner (shown if redirected from wrong character page) -->
<div class="mismatch-banner" id="mismatch-banner">⚠ 此頁面只限對應角色查閱，請用正確的角色帳號登入。</div>

<div class="card">
  <div class="card-eye">寇俠 · 江湖令牌</div>
  <div class="card-title" id="card-heading">角色登入與註冊</div>
  <div class="gold-rule"></div>

  <!-- already logged in view -->
  <div class="already-in" id="already-in">
    <div style="font-size:.82rem;color:var(--d);" id="already-logged-title">已以此角色登入</div>
    <div class="char-name" id="logged-char-name">—</div>
    <div class="player-name" id="logged-player-name">—</div>
    <a class="goto-btn" id="goto-script-btn" href="#">前往我的劇本 →</a>
    <span class="logout-link" id="logout-btn">登出</span>
  </div>

  <!-- unified smart form -->
  <form id="login-form" onsubmit="return false;">
    <div class="field">
      <label for="character-select">選擇扮演角色</label>
      <select id="character-select">
        <option value="">載入角色清單中…</option>
      </select>
    </div>

    <!-- Smart dynamic status hint -->
    <div id="status-hint" style="font-size: 0.8rem; color: var(--d); margin-bottom: 1.1rem; line-height: 1.6; padding: 0.2rem 0; display: none;"></div>

    <div class="field" id="player-name-field" style="display: none;">
      <label for="player-name">玩家真實姓名 / 暱稱</label>
      <input id="player-name" type="text" placeholder="例如：Tzc" />
    </div>

    <div class="field" id="password-field" style="display: none;">
      <label for="password" id="password-label">輸入密碼</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" />
    </div>

    <button class="submit-btn" id="submit-btn" type="submit" disabled>請先選擇角色</button>

    <div class="err-msg" id="err-msg">帳號或密碼錯誤，請再試一次。</div>
    <div class="success-msg" id="success-msg">登入成功，正在跳轉…</div>

    <div class="register-hint">
      需要主持大局？<a href="#" id="go-to-gm-login">切換至 GM 登入</a>
    </div>
  </form>
</div>

<div class="login-footer">
  <a href="index.html">玩家入口</a> ｜ <a href="../index.html">寇俠</a>
</div>

<script src="scripts/auth.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  if (params.get('mismatch')) {
    document.getElementById('mismatch-banner').style.display = 'block';
  }

  function scriptUrl(charId) {
    if (charId === 'gm') {
      return '../gm/index.html';
    }
    return 'scripts/' + charId + '.html';
  }

  function showLoggedIn(session) {
    document.getElementById('login-form').style.display = 'none';
    var el = document.getElementById('already-in');
    el.style.display = 'block';
    
    if (session.is_gm) {
      document.getElementById('already-logged-title').textContent = '已以此角色登入';
      document.getElementById('logged-char-name').textContent = 'GM (管理員)';
      document.getElementById('logged-player-name').textContent = '擁有完整管理與解密權限';
      document.getElementById('goto-script-btn').href = scriptUrl('gm');
    } else {
      document.getElementById('already-logged-title').textContent = '已以此角色登入';
      document.getElementById('logged-char-name').textContent = session.characterName;
      document.getElementById('logged-player-name').textContent = '玩家: ' + session.playerName;
      document.getElementById('goto-script-btn').href = scriptUrl(session.characterId);
    }
  }

  // Store raw character data globally in scope
  var charactersData = [];

  // Load and display character list for the unified dropdown
  function loadCharacters(selectedCharId) {
    var select = document.getElementById('character-select');
    select.innerHTML = '<option value="">-- 載入中 --</option>';
    
    fetch('/api/kou-xia/characters')
      .then(function (res) {
        if (!res.ok) { throw new Error('Static Fallback'); }
        return res.json();
      })
      .catch(function (err) {
        console.warn('Backend API unavailable. Loading static character list.', err);
        return [
          { characterId: 'wang-si-han', characterName: '王思涵', claimed: false },
          { characterId: 'jia-san-niang', characterName: '賈三娘', claimed: false },
          { characterId: 'diao-wu-er', characterName: '刁五兒', claimed: false },
          { characterId: 'yan-yi', characterName: '嚴逸', claimed: false },
          { characterId: 'yan-shi', characterName: '嚴氏', claimed: false },
          { characterId: 'wang-shun', characterName: '王順', claimed: false },
          { characterId: 'nong-sou', characterName: '農叟', claimed: false },
          { characterId: 'jin-si-dao', characterName: '金四刀', claimed: false },
          { characterId: 'zhang-meng', characterName: '張猛', claimed: false }
        ];
      })
      .then(function (data) {
        charactersData = data;
        select.innerHTML = '<option value="">-- 請選擇您的角色 --</option>';
        
        // Add standard characters
        data.forEach(function (char) {
          var opt = document.createElement('option');
          opt.value = char.characterId;
          if (char.claimed) {
            opt.textContent = char.characterName + ' (已由 ' + char.playerName + ' 註冊)';
          } else {
            opt.textContent = char.characterName + ' (🟢 尚未註冊)';
          }
          select.appendChild(opt);
        });

        // Add GM as a special subtle option at the bottom
        var optGm = document.createElement('option');
        optGm.value = 'gm';
        optGm.textContent = '主持人 (GM)';
        select.appendChild(optGm);

        if (selectedCharId) {
          select.value = selectedCharId;
          handleCharacterChange(selectedCharId);
        }
      });
  }

  function handleCharacterChange(charId) {
    var nameField = document.getElementById('player-name-field');
    var passField = document.getElementById('password-field');
    var statusHint = document.getElementById('status-hint');
    var submitBtn = document.getElementById('submit-btn');
    var cardHeading = document.getElementById('card-heading');
    var errEl = document.getElementById('err-msg');
    var okEl = document.getElementById('success-msg');

    if (errEl) errEl.classList.remove('show');
    if (okEl) okEl.classList.remove('show');

    if (!charId) {
      nameField.style.display = 'none';
      passField.style.display = 'none';
      statusHint.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '請先選擇角色';
      cardHeading.textContent = '角色登入與註冊';
      return;
    }

    submitBtn.disabled = false;
    passField.style.display = 'block';

    if (charId === 'gm') {
      nameField.style.display = 'none';
      statusHint.style.display = 'block';
      statusHint.innerHTML = '🎲 <strong>主持人大局登入</strong><br>請輸入您的專屬管理員密碼。';
      submitBtn.textContent = '進入主持主控台';
      cardHeading.textContent = 'GM 登入';
      document.getElementById('password').placeholder = '請輸入 GM 密碼';
      document.getElementById('password-label').textContent = 'GM 登入密碼';
    } else {
      var charInfo = null;
      for (var i = 0; i < charactersData.length; i++) {
        if (charactersData[i].characterId === charId) {
          charInfo = charactersData[i];
          break;
        }
      }

      if (charInfo && charInfo.claimed) {
        nameField.style.display = 'none';
        statusHint.style.display = 'block';
        statusHint.innerHTML = '🔵 <strong>此角色已被註冊</strong><br>玩家：' + charInfo.playerName + '，請輸入密碼登入劇本。';
        submitBtn.textContent = '驗證密碼進入劇本';
        cardHeading.textContent = '角色登入';
        document.getElementById('password').placeholder = '請輸入您的密碼';
        document.getElementById('password-label').textContent = '密碼';
      } else {
        nameField.style.display = 'block';
        statusHint.style.display = 'block';
        statusHint.innerHTML = '🟢 <strong>此角色尚未註冊</strong><br>請輸入您的玩家真實姓名，並設定一個密碼。';
        submitBtn.textContent = '註冊並進入劇本';
        cardHeading.textContent = '角色註冊';
        document.getElementById('password').placeholder = '請設定您的登入密碼';
        document.getElementById('password-label').textContent = '設定密碼';
      }
    }
  }

  // Hook change event
  document.getElementById('character-select').addEventListener('change', function (e) {
    handleCharacterChange(e.target.value);
  });

  // Check login state
  var session = CharAuth.getSession();
  if (session) { 
    showLoggedIn(session); 
  } else {
    loadCharacters();
  }

  // GM quick login
  var gmLoginBtn = document.getElementById('go-to-gm-login');
  if (gmLoginBtn) {
    gmLoginBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var select = document.getElementById('character-select');
      select.value = 'gm';
      handleCharacterChange('gm');

      // Autofill GM password and log in immediately
      document.getElementById('password').value = 'gm';
      
      var errEl = document.getElementById('err-msg');
      var okEl  = document.getElementById('success-msg');
      var btn = document.getElementById('submit-btn');
      
      if (errEl) errEl.classList.remove('show');
      if (okEl) okEl.classList.remove('show');
      
      if (btn) {
        btn.disabled = true;
        btn.textContent = '驗證中…';
      }

      CharAuth.login('gm', 'gm')
        .then(function (charId) {
          if (okEl) {
            okEl.textContent = 'GM 登入成功，正在跳轉…';
            okEl.classList.add('show');
          }
          setTimeout(function () {
            window.location.href = scriptUrl(charId);
          }, 800);
        })
        .catch(function (err) {
          if (btn) {
            btn.disabled = false;
            btn.textContent = '進入主持主控台';
          }
          if (errEl) {
            errEl.textContent = err.message || 'GM 登入失敗';
            errEl.classList.add('show');
          }
        });
    });
  }

  // Logout click
  document.getElementById('logout-btn').addEventListener('click', function () {
    CharAuth.logout();
    location.reload();
  });

  // Form submit handler
  document.getElementById('login-form').addEventListener('submit', function () {
    var charId = document.getElementById('character-select').value;
    var password = document.getElementById('password').value;
    var errEl = document.getElementById('err-msg');
    var okEl = document.getElementById('success-msg');
    var btn = document.getElementById('submit-btn');

    if (errEl) errEl.classList.remove('show');
    if (okEl) okEl.classList.remove('show');

    if (!charId) {
      errEl.textContent = '請先選擇角色。';
      errEl.classList.add('show');
      return;
    }
    if (!password) {
      errEl.textContent = '請輸入密碼。';
      errEl.classList.add('show');
      return;
    }

    var charInfo = null;
    for (var i = 0; i < charactersData.length; i++) {
      if (charactersData[i].characterId === charId) {
        charInfo = charactersData[i];
        break;
      }
    }

    btn.disabled = true;

    if (charId === 'gm' || (charInfo && charInfo.claimed)) {
      btn.textContent = '驗證中…';
      CharAuth.login(charId, password)
        .then(function (targetCharId) {
          if (okEl) {
            okEl.textContent = '登入成功，正在跳轉…';
            okEl.classList.add('show');
          }
          setTimeout(function () {
            window.location.href = scriptUrl(targetCharId);
          }, 800);
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = charId === 'gm' ? '進入主持主控台' : '驗證密碼進入劇本';
          if (errEl) {
            errEl.textContent = err.message || '密碼錯誤，請再試一次。';
            errEl.classList.add('show');
          }
        });
    } else {
      var playerName = document.getElementById('player-name').value.trim();
      if (!playerName) {
        btn.disabled = false;
        if (errEl) {
          errEl.textContent = '請填寫玩家真實姓名或暱稱。';
          errEl.classList.add('show');
        }
        return;
      }

      btn.textContent = '註冊中…';
      CharAuth.register(charId, playerName, password)
        .then(function (registeredId) {
          if (okEl) {
            okEl.textContent = '註冊並登入成功，正在進入劇本…';
            okEl.classList.add('show');
          }
          setTimeout(function () {
            window.location.href = scriptUrl(registeredId);
          }, 1000);
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = '註冊並進入劇本';
          if (errEl) {
            errEl.textContent = err.message || '註冊失敗，該角色可能已被註冊。';
            errEl.classList.add('show');
          }
        });
    }
  });
}());
</script>
</body>
</html>
